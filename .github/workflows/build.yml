name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Core Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        env:
          # This forces Buildozer to natively auto-accept all SDK and NDK licenses
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_ACCEPT_LICENSE: "1"
        run: |
          # Notice 'yes |' is completely gone. This prevents the pipeline from breaking.
          buildozer -v android debug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-apk
          path: bin/*.apk

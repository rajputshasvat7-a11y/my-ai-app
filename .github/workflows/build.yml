name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Using the official, self-contained Docker image built by the community
      - name: Build APK with Buildozer Docker Container
        uses: kawing-chiu/buildozer-action@v2
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-apk
          path: bin/*.apk

name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Explicitly set up Java required by Buildozer and Android tools
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installed explicit modern libraries to fix the aidl crash safely
      - name: Install Android Core Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev ccache
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          sudo apt-get install -y libncurses6 libtinfo6
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_ACCEPT_LICENSE: "1"
        run: |
          yes | buildozer -v android debug

      # This section grabs the compiled .apk out of the bin folder automatically
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-apk
          path: bin/*.apk

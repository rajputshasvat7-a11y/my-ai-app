name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use the official community action that configures Android SDK and aidl automatically
      - name: Build APK with Buildozer
        uses: ArtemGovorov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-apk
          path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/*/*.apk

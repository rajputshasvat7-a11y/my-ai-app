name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Using the standard, highly-vetted community actions build runner
      - name: Build Android APK with Buildozer
        uses: ActionsTools/buildozer-action@v1
        with:
          workdir: .

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-apk
          path: bin/*.apk
